name: Keep Zero Dark Claims Awake

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health check
        # -f makes the job FAIL on any non-2xx response, so a green check means the backend is up.
        # Retries cover a slow cold start.
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://zdc-backend.onrender.com/api/health
          echo
      - name: Confirm 38 CFR Part 4 is loaded
        run: |
          status=$(curl -fsS --retry 2 --retry-delay 10 --max-time 30 \
            https://zdc-backend.onrender.com/api/cfr/part4/status)
          echo "$status"
          echo "$status" | grep -q '"loaded":true' || { echo "::error::38 CFR Part 4 is not loaded on the backend"; exit 1; }
